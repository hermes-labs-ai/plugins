name: pilot-proof-once

on:
  pull_request:

permissions:
  contents: write

jobs:
  certify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run host certification
        run: |
          claude --version
          node scripts/pilot-proof.mjs --host claude
      - name: Commit canonical receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/pilot-proof-claude.json
          if git diff --cached --quiet; then
            echo "receipt unchanged"
            exit 0
          fi
          git commit -m "test: refresh Claude pilot-proof receipt"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
