name: validate-catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: npm run verify
      - run: npm run verify:network
      - run: npm run generate
      - run: git diff --exit-code -- catalog.json .claude-plugin/marketplace.json .agents/plugins/marketplace.json .github/plugin/marketplace.json
