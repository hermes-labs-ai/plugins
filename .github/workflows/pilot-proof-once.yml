name: pilot-proof-once

on:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run host certification
        run: |
          claude --version
          node scripts/pilot-proof.mjs --host claude
      - name: Upload receipt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-proof-claude
          path: |
            evidence/pilot-proof-claude.json
            evidence/pilot-proof-claude.json.partial.json
          if-no-files-found: error
